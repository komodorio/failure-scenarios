apiVersion: v1
kind: ConfigMap
metadata:
  namespace: anthos-bank
  name: shared-config
  labels:
    scenario: cascade-failure-missing-configmap
    application: web-app
data:
  APP_ENV: "production"
  LOG_LEVEL: "info"
  CACHE_ENABLED: "true"
  MAX_CONNECTIONS: "100"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: anthos-bank
  name: web-frontend
  labels:
    scenario: cascade-failure-missing-configmap
    application: web-app
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-frontend
      scenario: cascade-failure-missing-configmap
  template:
    metadata:
      labels:
        app: web-frontend
        scenario: cascade-failure-missing-configmap
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: nginx:1.21-alpine
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: shared-config
        env:
        - name: SERVICE_NAME
          value: "web-frontend"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: anthos-bank
  name: api-backend
  labels:
    scenario: cascade-failure-missing-configmap
    application: web-app
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-backend
      scenario: cascade-failure-missing-configmap
  template:
    metadata:
      labels:
        app: api-backend
        scenario: cascade-failure-missing-configmap
        tier: backend
    spec:
      containers:
      - name: backend
        image: nginx:1.21-alpine
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: shared-config
        env:
        - name: SERVICE_NAME
          value: "api-backend"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: anthos-bank
  name: data-processor
  labels:
    scenario: cascade-failure-missing-configmap
    application: web-app
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-processor
      scenario: cascade-failure-missing-configmap
  template:
    metadata:
      labels:
        app: data-processor
        scenario: cascade-failure-missing-configmap
        tier: backend
    spec:
      containers:
      - name: processor
        image: nginx:1.21-alpine
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: shared-config
        env:
        - name: SERVICE_NAME
          value: "data-processor"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi

