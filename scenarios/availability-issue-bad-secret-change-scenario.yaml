apiVersion: v1
kind: Secret
metadata:
  namespace: anthos-bank
  name: app-config
  labels:
    scenario: availability-issue-bad-secret-change
    application: python-worker
type: Opaque
stringData:
  APP_MODE: safe
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: anthos-bank
  name: python-worker
  labels:
    scenario: availability-issue-bad-secret-change
    application: python-worker
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-worker
      scenario: availability-issue-bad-secret-change
  template:
    metadata:
      labels:
        app: python-worker
        scenario: availability-issue-bad-secret-change
        tier: backend
    spec:
      containers:
      - name: worker
        image: python:3.10-slim
        env:
        - name: APP_MODE
          valueFrom:
            secretKeyRef:
              name: app-config
              key: APP_MODE
        command: ["python", "-u", "-c"]
        args:
        - |
          import os
          import time
          import sys
          
          val = os.getenv("APP_MODE", "")
          print(f"Starting application with APP_MODE = '{val}'")
          
          if val != "safe":
              print(f"ERROR: Invalid APP_MODE value '{val}', expected 'safe'")
              print("Application cannot start with invalid configuration")
              print("Exiting with error code 1")
              sys.exit(1)
          
          print("Configuration validated successfully")
          print("Application starting normally...")
          
          while True:
              print(f"[{time.strftime('%Y-%m-%d %H:%M:%S')}] Application running in safe mode")
              time.sleep(30)
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi

